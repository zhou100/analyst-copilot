services:
  postgres:
    image: postgres:17-alpine
    container_name: analyst-copilot-postgres
    environment:
      POSTGRES_DB: analyst_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - analyst_copilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analyst_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  analyst_copilot_postgres:
